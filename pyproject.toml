[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-gpt"
version = "1.2.0"
description = "A multi-user Austrian income tax preparation assistant with SQLite and Ollama document analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4.0",
  "Flask-SQLAlchemy>=3.1,<4.0",
  "gunicorn>=22.0,<23.0",
  "pypdf>=4.2,<5.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["taxgpt*"]

[tool.setuptools.package-data]
taxgpt = ["templates/**/*.html", "static/**/*"]
